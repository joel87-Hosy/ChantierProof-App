<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comptabilite | ChantierProof</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body class="min-h-screen dashboard-bg text-slate-950">
    <main class="mx-auto w-full max-w-6xl px-4 py-6 md-px-8">
      <header class="flex flex-col gap-4 border-b border-slate-200 pb-6 md-flex-row md-items-center md-justify-between">
        <div>
          <a class="back-link" href="./dashboard.html"><i data-lucide="arrow-left" class="icon"></i>Dashboard</a>
          <h1 class="mt-2 text-3xl font-bold">Comptabilite</h1>
          <p class="mt-2 text-slate-600">Demandes de facturation recues depuis les validations terrain.</p>
        </div>
        <button id="accounting-logout-btn" class="btn btn-secondary" type="button">
          <i data-lucide="log-out" class="icon"></i>
          Deconnexion
        </button>
      </header>

      <section class="mt-6 grid gap-4 md-grid-cols-3">
        <article class="panel">
          <p class="text-sm text-slate-500">A traiter</p>
          <p id="accounting-pending-count" class="mt-2 text-4xl font-bold">0</p>
        </article>
        <article class="panel">
          <p class="text-sm text-slate-500">Traitees</p>
          <p id="accounting-done-count" class="mt-2 text-4xl font-bold">0</p>
        </article>
        <article class="panel">
          <p class="text-sm text-slate-500">Derniere demande</p>
          <p id="accounting-last-date" class="mt-2 font-semibold">-</p>
        </article>
      </section>

      <section class="mt-6">
        <div class="flex flex-col gap-3 md-flex-row md-items-center md-justify-between">
          <div class="segmented" role="tablist" aria-label="Filtres comptabilite">
            <button class="segmented-btn active" data-accounting-filter="pending" type="button">A traiter</button>
            <button class="segmented-btn" data-accounting-filter="processed" type="button">Traitees</button>
            <button class="segmented-btn" data-accounting-filter="all" type="button">Toutes</button>
          </div>
          <button id="accounting-refresh-btn" class="btn btn-secondary" type="button">
            <i data-lucide="refresh-cw" class="icon"></i>
            Actualiser
          </button>
        </div>

        <p id="accounting-error" class="hidden mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
        <div class="mt-4 table-shell validations-scroll">
          <table class="w-full border-collapse text-left text-sm">
            <thead class="bg-slate-100 text-xs uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-4 py-3">Client</th>
                <th class="px-4 py-3">Intervention</th>
                <th class="px-4 py-3">Tarif</th>
                <th class="px-4 py-3">Recu le</th>
                <th class="px-4 py-3">Statut</th>
                <th class="px-4 py-3">Detail</th>
                <th class="px-4 py-3">Preuve</th>
                <th class="px-4 py-3">Action</th>
              </tr>
            </thead>
            <tbody id="accounting-requests-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./lib/config.js"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/pdf.js"></script>
    <script src="./assets/js/accounting.js"></script>
  </body>
</html>
