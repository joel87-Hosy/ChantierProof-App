<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion | ChantierProof</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body class="min-h-screen login-bg text-slate-950">
    <main class="auth-shell mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center px-4 py-8">
      <section class="auth-card panel">
        <div class="brand-lockup">
          <span class="brand-mark">CP</span>
          <span class="text-sm font-semibold uppercase tracking-wide text-blue-700">ChantierProof</span>
        </div>
        <h1 id="auth-title" class="mt-5 text-3xl font-bold">Connexion</h1>
        <p id="auth-copy" class="mt-2 text-slate-600">Accedez au dashboard de votre entreprise.</p>

        <form id="auth-form" class="mt-5 space-y-4">
          <label class="block">
            <span class="label">Email</span>
            <input id="email" class="input mt-2" type="email" autocomplete="email" required>
          </label>
          <label class="block">
            <span class="label">Mot de passe</span>
            <span class="password-field mt-2">
              <input id="password" class="input password-input" type="password" autocomplete="current-password" minlength="12" required>
              <button id="toggle-password" class="password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
                <i data-lucide="eye" class="icon"></i>
              </button>
            </span>
          </label>

          <p id="auth-error" class="hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
          <p id="auth-success" class="hidden rounded-lg bg-green-100 px-4 py-3 text-sm text-green-700"></p>

          <button id="auth-submit" class="btn btn-primary w-full" type="submit">
            <i data-lucide="log-in" class="icon"></i>
            Se connecter
          </button>
          <p class="text-xs text-slate-500">Mot de passe oublié ? Demandez à l’administrateur de votre entreprise de générer un lien de réinitialisation.</p>
          <p class="text-xs leading-6 text-slate-500">
            En utilisant ChantierProof, vous acceptez les
            <a class="text-blue-700 font-semibold" href="./conditions-utilisation.html">conditions d'utilisation</a>
            et la
            <a class="text-blue-700 font-semibold" href="./politique-confidentialite.html">politique de confidentialite</a>.
          </p>
        </form>

        <form id="activation-form" class="mt-5 hidden space-y-4">
          <p id="activation-copy" class="text-slate-600"></p>
          <label class="block">
            <span class="label">Email de l'invitation</span>
            <input id="activation-email" class="input mt-2" type="email" autocomplete="email" readonly required>
          </label>
          <label class="block">
            <span class="label">Choisissez un mot de passe (12 caractères minimum)</span>
            <span class="password-field mt-2">
              <input id="activation-password" class="input password-input" type="password" autocomplete="new-password" minlength="12" required>
              <button id="toggle-activation-password" class="password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
                <i data-lucide="eye" class="icon"></i>
              </button>
            </span>
          </label>
          <p id="activation-error" class="hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
          <p id="activation-success" class="hidden rounded-lg bg-green-100 px-4 py-3 text-sm text-green-700"></p>
          <button id="activation-submit" class="btn btn-primary w-full" type="submit" disabled>
            <i data-lucide="user-check" class="icon"></i>
            Activer mon compte
          </button>
          <button id="return-login" class="btn btn-secondary w-full" type="button">Retour à la connexion</button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./assets/js/auth.js"></script>
  </body>
</html>
