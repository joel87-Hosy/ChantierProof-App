<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Réinitialiser le mot de passe | ChantierProof</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body class="min-h-screen login-bg text-slate-950">
    <main class="auth-shell mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center px-4 py-8">
      <section class="auth-card panel">
        <div class="brand-lockup">
          <span class="brand-mark">CP</span>
          <span class="text-sm font-semibold uppercase tracking-wide text-blue-700">ChantierProof</span>
        </div>
        <h1 class="mt-5 text-3xl font-bold">Nouveau mot de passe</h1>
        <p id="reset-copy" class="mt-2 text-slate-600">Vérification du lien…</p>
        <form id="reset-form" class="mt-5 hidden space-y-4">
          <label class="block">
            <span class="label">Nouveau mot de passe (12 caractères minimum)</span>
            <input id="reset-password" class="input mt-2" type="password" autocomplete="new-password" minlength="12" required>
          </label>
          <label class="block">
            <span class="label">Confirmer le mot de passe</span>
            <input id="reset-confirm" class="input mt-2" type="password" autocomplete="new-password" minlength="12" required>
          </label>
          <p id="reset-error" class="hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
          <p id="reset-success" class="hidden rounded-lg bg-green-100 px-4 py-3 text-sm text-green-700"></p>
          <button id="reset-submit" class="btn btn-primary w-full" type="submit">Enregistrer le nouveau mot de passe</button>
        </form>
        <a class="btn btn-secondary mt-4 w-full" href="./login.html">Retour à la connexion</a>
      </section>
    </main>
    <script src="./assets/js/password-reset.js"></script>
  </body>
</html>
