server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /var/www/chantierproof-staging;

    location = /api/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location / {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }
}
